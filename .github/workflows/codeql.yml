name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript
            build-mode: none

    steps:
    - uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.37.9
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      if: matrix.language == 'csharp'
      run: dotnet restore

    - name: Build
      if: matrix.language == 'csharp'
      run: dotnet build --configuration Release --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.37.9
      with:
        category: '/language:${{ matrix.language }}'
        output: sarif-results
        upload: failure-only

    # paths-ignore cannot keep a manual C# build out of obj/, where the [GeneratedRegex]
    # source generator writes the syntax trees for ApiAllowlist and LogSanitizer. Results
    # there are in code nobody here wrote, so drop them before uploading.
    - name: Filter build intermediates
      uses: advanced-security/filter-sarif@v1.1
      with:
        patterns: |
          -**/obj/**
          -**/bin/**
        input: sarif-results/${{ matrix.language }}.sarif
        output: sarif-results/${{ matrix.language }}.sarif

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v4.37.9
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif
        category: '/language:${{ matrix.language }}'
